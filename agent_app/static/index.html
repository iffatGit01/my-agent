<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Easy Agent</title>
  <style>
    :root {
      --bg: #f4f5fb;
      --surface: #ffffff;
      --surface-2: #eef0fa;
      --text: #1b1d2a;
      --muted: #6b7088;
      --border: #e2e5f2;
      --accent: #6c5ce7;
      --accent-2: #00b8d9;
      --accent-contrast: #ffffff;
      --user-bubble: linear-gradient(135deg, #6c5ce7, #8e7bff);
      --agent-bubble: #f1f3fc;
      --error: #d63a4a;
      --error-bg: #fdecee;
      --shadow: 0 20px 60px rgba(60, 60, 120, .15);
    }
    :root[data-theme="dark"] {
      --bg: #0e1020;
      --surface: #171a2e;
      --surface-2: #1f2340;
      --text: #eceefb;
      --muted: #9aa0c3;
      --border: #2a2f52;
      --agent-bubble: #20244a;
      --error: #ff7a88;
      --error-bg: #3a1d27;
      --shadow: 0 20px 60px rgba(0, 0, 0, .45);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(108, 92, 231, .25), transparent 60%),
        radial-gradient(800px 500px at 110% 10%, rgba(0, 184, 217, .20), transparent 60%),
        var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: min(88vh, 820px);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* ---------- header ---------- */
    header {
      display: flex;
      align-items: center;
      gap: .85rem;
      padding: 1rem 1.25rem;
      color: #fff;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
    }
    .logo {
      width: 42px; height: 42px; border-radius: 14px;
      display: grid; place-items: center;
      background: rgba(255,255,255,.2);
      backdrop-filter: blur(6px);
      font-size: 1.4rem;
    }
    .title { flex: 1; line-height: 1.2; }
    .title h1 { margin: 0; font-size: 1.1rem; font-weight: 650; }
    .title small { opacity: .9; display: flex; align-items: center; gap: .4rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #5dffa8; box-shadow: 0 0 0 3px rgba(93,255,168,.25); }

    .icon-btn {
      border: 0; cursor: pointer; color: #fff;
      background: rgba(255,255,255,.18);
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center; font-size: 1.05rem;
      transition: background .15s, transform .15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.3); }
    .icon-btn:active { transform: scale(.94); }

    /* ---------- chat log ---------- */
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .9rem;
      scroll-behavior: smooth;
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 460px;
      animation: rise .5s ease both;
    }
    .welcome .big { font-size: 2.6rem; }
    .welcome h2 { margin: .4rem 0 .3rem; font-size: 1.35rem; }
    .welcome p { margin: 0 0 1.1rem; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }
    .chip {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: .55rem .9rem;
      border-radius: 999px;
      font-size: .9rem;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s;
    }
    .chip:hover { transform: translateY(-2px); border-color: var(--accent); }

    .row { display: flex; gap: .6rem; align-items: flex-end; animation: rise .25s ease both; }
    .row.user { flex-direction: row-reverse; }
    .avatar {
      flex: none; width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center; font-size: .95rem;
      background: var(--surface-2); border: 1px solid var(--border);
    }
    .row.user .avatar { background: var(--accent); color: #fff; border: 0; }

    .bubble-wrap { max-width: 78%; display: flex; flex-direction: column; gap: .25rem; }
    .row.user .bubble-wrap { align-items: flex-end; }
    .bubble {
      padding: .7rem 1rem;
      border-radius: 18px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .row.agent .bubble { background: var(--agent-bubble); border-bottom-left-radius: 6px; }
    .row.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 6px; }
    .row.agent.error .bubble { background: var(--error-bg); color: var(--error); border: 1px solid var(--error); }

    .shot { display: block; max-width: 100%; margin-top: .6rem; border-radius: 12px; border: 1px solid var(--border); }
    .meta { display: flex; gap: .6rem; align-items: center; font-size: .72rem; color: var(--muted); padding: 0 .3rem; }
    .meta button {
      border: 0; background: none; color: var(--muted); cursor: pointer; font-size: .72rem; padding: 0;
    }
    .meta button:hover { color: var(--accent); text-decoration: underline; }

    /* ---------- typing indicator ---------- */
    .typing .bubble { display: flex; gap: 5px; padding: .85rem 1rem; }
    .typing .bubble span {
      width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
      animation: bounce 1.1s infinite ease-in-out;
    }
    .typing .bubble span:nth-child(2) { animation-delay: .15s; }
    .typing .bubble span:nth-child(3) { animation-delay: .3s; }

    /* ---------- composer ---------- */
    form {
      display: flex; gap: .6rem; align-items: center;
      padding: .9rem 1rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    #msg {
      flex: 1;
      padding: .85rem 1.1rem;
      font-size: 1rem;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    #msg:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(108, 92, 231, .18); }
    #send {
      display: inline-flex; align-items: center; gap: .45rem;
      border: 0; cursor: pointer;
      padding: .85rem 1.25rem;
      font-size: 1rem; font-weight: 600;
      color: var(--accent-contrast);
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      transition: transform .15s, filter .15s, opacity .15s;
    }
    #send:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); }
    #send:disabled { opacity: .55; cursor: not-allowed; }

    /* Hidden live region: screen readers (and tests) get the latest reply here. */
    [data-testid="reply"] {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-6px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
    @media (max-width: 520px) {
      body { padding: 0; }
      .app { height: 100vh; border-radius: 0; border: 0; max-width: none; }
      .bubble-wrap { max-width: 86%; }
      #send span.label { display: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">🤖</div>
      <div class="title">
        <h1>Easy Agent</h1>
        <small><span class="dot" aria-hidden="true"></span> Online &middot; ready to help</small>
      </div>
      <button class="icon-btn" id="clear" type="button" title="Clear chat" aria-label="Clear chat">🗑</button>
      <button class="icon-btn" id="theme" type="button" title="Switch theme" aria-label="Switch theme">🌓</button>
    </header>

    <section id="log" data-testid="log" aria-label="Conversation">
      <div class="welcome" id="welcome" data-testid="welcome">
        <div class="big" aria-hidden="true">✨</div>
        <h2>How can I help today?</h2>
        <p>Try one of these, or type your own question.</p>
        <div class="chips">
          <button class="chip" type="button" data-prompt="What's the weather in Dhaka?">🌦 Weather in Dhaka</button>
          <button class="chip" type="button" data-prompt="What's the weather in Tokyo?">🗼 Weather in Tokyo</button>
          <button class="chip" type="button" data-prompt="add 2 and 40">➕ Add 2 and 40</button>
          <button class="chip" type="button" data-prompt="What is WinSCP?">🔎 What is WinSCP?</button>
          <button class="chip" type="button" data-prompt="Open https://example.com and tell me what it says">🌐 Open example.com</button>
        </div>
      </div>
    </section>

    <form id="chat-form" autocomplete="off">
      <input id="msg" data-testid="msg" type="text" placeholder="Ask me anything..." aria-label="Your message">
      <button id="send" type="submit"><span class="label">Send</span><span aria-hidden="true">➤</span></button>
    </form>

    <!-- Visually hidden; always holds the latest reply. -->
    <div data-testid="reply" aria-live="polite"></div>
  </main>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const replyEl = document.querySelector('[data-testid="reply"]');
    const welcome = document.getElementById("welcome");
    const root = document.documentElement;

    let busy = false;
    let lastMessage = "";

    /* ---------- theme ---------- */
    function applyTheme(theme) { root.setAttribute("data-theme", theme); }
    (function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      const prefersDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(saved || (prefersDark ? "dark" : "light"));
    })();
    document.getElementById("theme").addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });

    /* ---------- helpers ---------- */
    const time = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const scrollDown = () => { log.scrollTop = log.scrollHeight; };

    function addMessage(role, text, opts = {}) {
      if (welcome.isConnected) welcome.remove();

      const row = document.createElement("div");
      row.className = "row " + role + (opts.error ? " error" : "");
      row.dataset.role = role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = role === "user" ? "🙂" : "🤖";

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      // A reply may contain the path of a screenshot taken by the browsing tool.
      let shownText = text;
      let shotPath = null;
      if (role === "agent" && !opts.error) {
        const found = text.match(/\/static\/shots\/[\w-]+\.png/);
        if (found) { shotPath = found[0]; shownText = text.replace(found[0], "").trim(); }
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = shownText;
      if (shotPath) {
        const link = document.createElement("a");
        link.href = shotPath; link.target = "_blank"; link.rel = "noopener";
        const img = document.createElement("img");
        img.src = shotPath; img.alt = "Page screenshot"; img.className = "shot";
        img.setAttribute("data-testid", "screenshot");
        img.addEventListener("load", scrollDown);
        link.appendChild(img);
        bubble.appendChild(link);
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      const stamp = document.createElement("span");
      stamp.textContent = time();
      meta.appendChild(stamp);

      if (role === "agent" && !opts.error) {
        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "Copy";
        copy.setAttribute("aria-label", "Copy reply");
        copy.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(text); copy.textContent = "Copied!"; }
          catch (e) { copy.textContent = "Press Ctrl+C"; }
          setTimeout(() => (copy.textContent = "Copy"), 1500);
        });
        meta.appendChild(copy);
      }
      if (opts.error) {
        const retry = document.createElement("button");
        retry.type = "button";
        retry.textContent = "Try again";
        retry.addEventListener("click", () => { row.remove(); ask(lastMessage); });
        meta.appendChild(retry);
      }

      wrap.append(bubble, meta);
      row.append(avatar, wrap);
      log.appendChild(row);
      scrollDown();
      return row;
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "row agent typing";
      row.dataset.testid = "typing";
      row.setAttribute("data-testid", "typing");
      row.innerHTML = '<div class="avatar" aria-hidden="true">🤖</div>' +
        '<div class="bubble-wrap"><div class="bubble"><span></span><span></span><span></span></div></div>';
      log.appendChild(row);
      scrollDown();
      return row;
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
      input.disabled = value;
      if (!value) input.focus();
    }

    /* ---------- talking to the agent ---------- */
    async function ask(message) {
      if (busy || !message) return;
      lastMessage = message;

      replyEl.className = "";
      replyEl.textContent = "";
      addMessage("user", message);
      input.value = "";
      setBusy(true);
      const typing = showTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        typing.remove();
        if (!res.ok) {
          const text = "Something went wrong: " + (data.error || res.status);
          replyEl.className = "error";
          replyEl.textContent = text;
          addMessage("agent", text, { error: true });
        } else {
          replyEl.textContent = data.reply;
          addMessage("agent", data.reply);
        }
      } catch (err) {
        typing.remove();
        const text = "Network error: " + err;
        replyEl.className = "error";
        replyEl.textContent = text;
        addMessage("agent", text, { error: true });
      } finally {
        setBusy(false);
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      ask(input.value.trim());
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => ask(chip.dataset.prompt));
    });

    document.getElementById("clear").addEventListener("click", () => {
      if (busy) return;
      log.innerHTML = "";
      log.appendChild(welcome);
      replyEl.className = "";
      replyEl.textContent = "";
      input.focus();
    });

    input.focus();
  </script>
</body>
</html>
