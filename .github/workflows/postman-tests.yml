name: Postman Collection Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'  # Runs every Monday at 9 AM

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        run: |
          newman run "https://api.getpostman.com/collections/${{ secrets.POSTMAN_COLLECTION_ID }}" \
            --environment "https://api.getpostman.com/environments/YOUR_ENVIRONMENT_ID" \
            --api-key ${{ secrets.POSTMAN_API_KEY }} \
            --reporters cli,json \
            --reporter-json-export newman-results.json

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: newman-results
          path: newman-results.json
